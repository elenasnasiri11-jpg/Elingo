
name: Build Elingo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Elingo_Android_Project_CloudBuild.zip'
      - '.github/workflows/elingo-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -la
          test -f Elingo_Android_Project_CloudBuild.zip

      - name: Extract Android project
        run: |
          mkdir project
          unzip -o Elingo_Android_Project_CloudBuild.zip -d project
          find project -type f | head -80

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elingo-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
